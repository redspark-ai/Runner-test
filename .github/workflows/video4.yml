name: video4
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render
        continue-on-error: true
        run: |
          mkdir -p results
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          curl -sL -m 300 -o bbb.src https://archive.org/download/BigBuckBunny_124/Content/big_buck_bunny_720p_surround.mp4
          F=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
          ffmpeg -y -ss 62 -t 5 -i bbb.src -ss 150 -t 5 -i bbb.src -ss 300 -t 5 -i bbb.src -ss 420 -t 5 -i bbb.src -filter_complex "[0:v]scale=854:480,setsar=1,fade=t=in:d=0.5[v0];[1:v]scale=854:480,setsar=1[v1];[2:v]scale=854:480,setsar=1[v2];[3:v]scale=854:480,setsar=1,fade=t=out:st=4.5:d=0.5[v3];[v0][v1][v2][v3]concat=n=4:v=1:a=0,drawtext=fontfile=$F:text='Big Buck Bunny (c) Blender Foundation - CC BY 3.0':fontcolor=white:fontsize=18:box=1:boxcolor=black@0.5:x=10:y=h-30[v];[0:a][1:a][2:a][3:a]concat=n=4:v=0:a=1,afade=t=out:st=19:d=1[a]" -map "[v]" -map "[a]" -c:v libx264 -preset veryfast -crf 23 -c:a aac -ac 2 -pix_fmt yuv420p results/bbb_cut.mp4 2> results/log2.txt
      - name: Save
        run: |
          git config user.name runner; git config user.email runner@example.com
          git add results/log2.txt results/bbb_cut.mp4 || git add results/log2.txt
          git commit -m "video4"; git push
