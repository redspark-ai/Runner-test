name: f5tts
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: F5-TTS
        continue-on-error: true
        env:
          TXT: "Hi my name is bloo and I love cakes, I eat them a lot"
        run: |
          mkdir -p results
          (pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu && pip install -q f5-tts && f5-tts_infer-cli --model F5TTS_v1_Base --gen_text "$TXT" --output_dir results --output_file f5.wav) > results/f5_log.txt 2>&1
          tail -n 30 results/f5_log.txt > results/f5_tail.txt; rm results/f5_log.txt
      - name: Save
        run: |
          git config user.name runner; git config user.email runner@example.com
          git add -A results
          git commit -m f5 || true
          git push || (git pull --rebase && git push)
