name: cat3d2
on: workflow_dispatch
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run
        continue-on-error: true
        run: |
          pip install -q gradio_client
          python - <<'PY' > results/cat/log2.txt 2>&1
          import shutil,traceback
          from gradio_client import Client, handle_file
          for sp in ["trellis-community/TRELLIS","JeffreyXiang/TRELLIS","microsoft/TRELLIS.2","cavargas10/TRELLIS"]:
              print("== trying",sp)
              try:
                  c=Client(sp)
                  eps=c.view_api(return_format="dict")["named_endpoints"]
                  print(list(eps))
                  try: c.predict(api_name="/start_session")
                  except Exception as e: print("start_session",str(e)[:100])
                  img=c.predict(image=handle_file("results/cat/cat.jpg"),api_name="/preprocess_image")
                  kw={}
                  for p in eps["/image_to_3d"]["parameters"]:
                      n=p["parameter_name"]
                      if n=="image": kw[n]=handle_file(img)
                      elif p.get("parameter_has_default"): kw[n]=p["parameter_default"]
                  c.predict(api_name="/image_to_3d",**kw)
                  kw2={p["parameter_name"]:p["parameter_default"] for p in eps["/extract_glb"]["parameters"] if p.get("parameter_has_default")}
                  g=c.predict(api_name="/extract_glb",**kw2)
                  print("glb",g)
                  path=[x for x in (g if isinstance(g,(list,tuple)) else [g]) if isinstance(x,str) and x.endswith(".glb")][0]
                  shutil.copy(path,"results/cat/cat.glb"); print("OK",sp); break
              except Exception:
                  print(traceback.format_exc()[-400:])
          PY
      - name: Save
        if: always()
        run: |
          git config user.name runner; git config user.email runner@example.com
          git add -A results
          git commit -m cat3d2 || true
          git push || (git pull --rebase && git push)
