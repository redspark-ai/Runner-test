name: stickman10
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg unzip >/dev/null
          pip install -q kokoro-onnx soundfile pillow numpy
      - name: assets
        run: |
          B=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          wget -q $B/kokoro-v1.0.onnx $B/voices-v1.0.bin
          U=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/DanielSWolf/rhubarb-lip-sync/releases/latest | python3 -c "import sys,json;print([a['browser_download_url'] for a in json.load(sys.stdin)['assets'] if 'Linux' in a['name']][0])")
          wget -q -O rb.zip "$U" && unzip -q rb.zip && mv Rhubarb-Lip-Sync-* rb
      - name: voice
        run: |
          python3 - <<'PY'
          import soundfile as sf
          from kokoro_onnx import Kokoro
          t="Hi! I'm your stickman guide. Today we will learn how to save time using free tools. Stay tuned, and let's get started!"
          open('dialog.txt','w').write(t)
          k=Kokoro('kokoro-v1.0.onnx','voices-v1.0.bin')
          s,sr=k.create(t,voice='af_heart',speed=1.0,lang='en-us')
          sf.write('voice.wav',s,sr)
          print('dur',len(s)/sr)
          PY
          ./rb/rhubarb -f json -d dialog.txt -o mouth.json voice.wav -q
      - name: render
        run: |
          mkdir -p results
          python3 - <<'PY'
          import json,math,subprocess
          from PIL import Image,ImageDraw
          W,H,FPS=1280,720,24
          cues=json.load(open('mouth.json'))['mouthCues']
          dur=cues[-1]['end']+0.4
          N=int(dur*FPS)
          def shape(t):
              for c in cues:
                  if c['start']<=t<c['end']: return c['value']
              return 'X'
          p=subprocess.Popen(['ffmpeg','-y','-loglevel','error','-f','rawvideo','-pix_fmt','rgb24','-s',f'{W}x{H}','-r',str(FPS),'-i','-','-i','voice.wav','-c:v','libx264','-pix_fmt','yuv420p','-c:a','aac','-shortest','results/stickman10.mp4'],stdin=subprocess.PIPE)
          import os; os.makedirs('results',exist_ok=True)
          for f in range(N):
              t=f/FPS
              im=Image.new('RGB',(W,H),(245,240,225)); d=ImageDraw.Draw(im)
              cx,cy=W//2,300; bob=int(4*math.sin(t*3))
              hy=cy-120+bob
              d.ellipse([cx-70,hy-70,cx+70,hy+70],outline=(20,20,20),width=8,fill=(255,255,255))
              d.line([cx,hy+70,cx,cy+160+bob],fill=(20,20,20),width=8)
              wave=math.sin(t*5)*30
              d.line([cx,hy+110,cx-110,hy+190],fill=(20,20,20),width=8)
              d.line([cx,hy+110,cx+120,hy+60+wave],fill=(20,20,20),width=8)
              d.line([cx,cy+160+bob,cx-70,cy+310],fill=(20,20,20),width=8)
              d.line([cx,cy+160+bob,cx+70,cy+310],fill=(20,20,20),width=8)
              blink=(t%3.0)<0.15
              for ex in (-25,25):
                  if blink: d.line([cx+ex-8,hy-15,cx+ex+8,hy-15],fill=(20,20,20),width=4)
                  else: d.ellipse([cx+ex-7,hy-22,cx+ex+7,hy-8],fill=(20,20,20))
              m=shape(t); my=hy+30
              if m in('X','A'): d.line([cx-18,my,cx+18,my],fill=(20,20,20),width=5)
              elif m=='B': d.ellipse([cx-16,my-5,cx+16,my+7],fill=(60,20,20))
              elif m=='C': d.ellipse([cx-20,my-8,cx+20,my+14],fill=(60,20,20))
              elif m=='D': d.ellipse([cx-24,my-10,cx+24,my+22],fill=(60,20,20))
              elif m=='E': d.ellipse([cx-14,my-10,cx+14,my+16],fill=(60,20,20))
              elif m=='F': d.ellipse([cx-9,my-8,cx+9,my+10],fill=(60,20,20))
              elif m=='G': d.line([cx-18,my,cx+18,my],fill=(20,20,20),width=5); d.line([cx-12,my+5,cx+12,my+5],fill=(255,255,255),width=4)
              else: d.ellipse([cx-18,my-6,cx+18,my+10],fill=(60,20,20))
              p.stdin.write(im.tobytes())
          p.stdin.close(); p.wait()
          PY
          ls -l results | cut -c1-80
      - name: push
        run: |
          git config user.name bot; git config user.email bot@x.com
          git add results; git commit -qm "stickman10 result"; git push -q
