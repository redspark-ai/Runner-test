name: video2
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render
        run: |
          mkdir -p results
          curl -sL -o bbb.mov https://download.blender.org/peach/bigbuckbunny_movies/big_buck_bunny_480p_h264.mov || true
          ls -la bbb.mov
          F=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
          ffmpeg -y -ss 62 -t 5 -i bbb.mov -ss 150 -t 5 -i bbb.mov -ss 300 -t 5 -i bbb.mov -ss 420 -t 5 -i bbb.mov -filter_complex "[0:v]scale=854:480,setsar=1,fade=t=in:d=0.5[v0];[1:v]scale=854:480,setsar=1[v1];[2:v]scale=854:480,setsar=1[v2];[3:v]scale=854:480,setsar=1,fade=t=out:st=4.5:d=0.5[v3];[v0][v1][v2][v3]concat=n=4:v=1:a=0,drawtext=fontfile=$F:text='Big Buck Bunny (c) Blender Foundation - CC BY 3.0':fontcolor=white:fontsize=18:box=1:boxcolor=black@0.5:x=10:y=h-30[v];[0:a][1:a][2:a][3:a]concat=n=4:v=0:a=1,afade=t=out:st=19:d=1[a]" -map "[v]" -map "[a]" -c:v libx264 -preset veryfast -crf 23 -c:a aac -pix_fmt yuv420p results/bbb_cut.mp4
          ls -la results
      - name: Save
        run: |
          git config user.name runner; git config user.email runner@example.com
          git add results/bbb_cut.mp4; git commit -m "video2"; git push
