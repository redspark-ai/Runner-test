name: api3
on: workflow_dispatch
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dump
        continue-on-error: true
        run: |
          pip install -q gradio_client
          python - <<'PY' > results/cat/api3.txt 2>&1
          from gradio_client import Client
          for sp in ["microsoft/TRELLIS.2","trellis-community/TRELLIS"]:
              print("==",sp)
              try:
                  eps=Client(sp).view_api(return_format="dict")["named_endpoints"]
                  for k,v in eps.items():
                      print(k,[(p["parameter_name"],p.get("component"),p.get("parameter_default")) for p in v["parameters"]],"->",[r.get("component") for r in v["returns"]])
              except Exception as e: print("ERR",str(e)[:200])
          PY
      - name: Save
        if: always()
        run: |
          git config user.name runner; git config user.email runner@example.com
          git add -A results
          git commit -m api3 || true
          git push || (git pull --rebase && git push)
