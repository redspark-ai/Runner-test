name: runner-test
on:
  push:
    paths: ['.github/workflows/test.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect specs and test internet
        run: |
          mkdir -p results
          {
            echo "cores: $(nproc)"
            free -h | head -2
            df -h / | tail -1
            for u in https://huggingface.co https://pypi.org https://api.github.com https://example.com; do
              echo "$u -> $(curl -s -o /dev/null -w '%{http_code}' -m 10 $u)"
            done
          } > results/specs.txt
          cat results/specs.txt
      - name: Save results to repo
        run: |
          git config user.name "runner-bot"
          git config user.email "bot@users.noreply.github.com"
          git add results/specs.txt
          git commit -m "runner results" || true
          git push
