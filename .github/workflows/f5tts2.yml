name: f5tts2
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: F5-TTS
        continue-on-error: true
        env:
          TXT: "Hi my name is bloo and I love cakes, I eat them a lot"
        run: |
          mkdir -p results
          rm -f results/f5_log.txt
          pip install -q torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu > results/f5_log2.txt 2>&1 || true
          pip install -q f5-tts >> results/f5_log2.txt 2>&1 || true
          pip install -q torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu >> results/f5_log2.txt 2>&1 || true
          pip uninstall -y torchcodec >> results/f5_log2.txt 2>&1 || true
          f5-tts_infer-cli --model F5TTS_v1_Base --gen_text "$TXT" --output_dir results --output_file f5.wav >> results/f5_log2.txt 2>&1 || true
          tail -n 25 results/f5_log2.txt > results/f5_tail.txt; rm -f results/f5_log2.txt
      - name: Save
        run: |
          git config user.name runner; git config user.email runner@example.com
          git add -A results
          git commit -m f5b || true
          git push || (git pull --rebase && git push)
