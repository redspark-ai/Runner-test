name: cat4
on: workflow_dispatch
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run
        continue-on-error: true
        run: |
          pip install -q gradio_client
          python - <<'PY' > results/cat/log4.txt 2>&1
          import shutil,traceback
          from gradio_client import Client, handle_file
          def defaults(eps,name,skip=()):
              return {p["parameter_name"]:p["parameter_default"] for p in eps[name]["parameters"] if p.get("parameter_has_default") and p["parameter_name"] not in skip}
          def glb_of(g):
              return [x for x in (g if isinstance(g,(list,tuple)) else [g]) if isinstance(x,str) and x.endswith(".glb")][0]
          done=False
          try:
              print("== TRELLIS.2")
              c=Client("microsoft/TRELLIS.2"); eps=c.view_api(return_format="dict")["named_endpoints"]
              c.predict(api_name="/start_session")
              img=c.predict(input=handle_file("results/cat/cat.jpg"),api_name="/preprocess_image")
              kw=defaults(eps,"/image_to_3d",("image",)); kw["image"]=handle_file(img)
              c.predict(api_name="/image_to_3d",**kw)
              g=c.predict(api_name="/extract_glb",**defaults(eps,"/extract_glb"))
              shutil.copy(glb_of(g),"results/cat/cat.glb"); print("OK trellis2"); done=True
          except Exception:
              print(traceback.format_exc()[-500:])
          if not done:
              try:
                  print("== community TRELLIS")
                  c=Client("trellis-community/TRELLIS"); eps=c.view_api(return_format="dict")["named_endpoints"]
                  c.predict(api_name="/start_session")
                  img=c.predict(image=handle_file("results/cat/cat.jpg"),api_name="/preprocess_image")
                  kw=defaults(eps,"/generate_and_extract_glb",("image",)); kw["image"]=handle_file(img)
                  g=c.predict(api_name="/generate_and_extract_glb",**kw)
                  shutil.copy(glb_of(g),"results/cat/cat.glb"); print("OK community")
              except Exception:
                  print(traceback.format_exc()[-500:])
          PY
      - name: Save
        if: always()
        run: |
          git config user.name runner; git config user.email runner@example.com
          git add -A results
          git commit -m cat4 || true
          git push || (git pull --rebase && git push)
