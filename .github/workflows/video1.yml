name: video1
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render
        run: |
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          mkdir -p results
          ffmpeg -y -f lavfi -i "mandelbrot=s=960x540:r=30" -f lavfi -i "sine=frequency=110:sample_rate=44100" -t 20 -vf "format=yuv420p" -af "volume=0.3,afade=t=in:d=2,afade=t=out:st=18:d=2" -c:v libx264 -preset veryfast -crf 23 -c:a aac -shortest results/mandelbrot.mp4
          ls -la results
      - name: Save
        run: |
          git config user.name runner; git config user.email runner@example.com
          git add results/mandelbrot.mp4; git commit -m "video"; git push
